<title>イタグレ解剖生理ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone-first app, sticky status bar on top, tab bar fixed at bottom, the dog scene as the home hero */
:root{
  --bg:#EFF4F1; --surface:#FFFFFF; --soft:#E3ECE7; --ink:#1E2A26; --muted:#5B6964; --line:#D5E0DA;
  --accent:#D44A6E; --accent-soft:#FBE3EA; --accent-ink:#FFFFFF;
  --gold:#D99A1C; --gold-soft:#FCEFD2; --good:#2B9566; --good-soft:#DDF3E8; --bad:#D04646; --bad-soft:#FBE2E2;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07);
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A17; --surface:#1B2521; --soft:#24302B; --ink:#E6EEEA; --muted:#9BABA4; --line:#2F3C37;
  --accent:#F27394; --accent-soft:#3D2430; --accent-ink:#1A0E12;
  --gold:#F0BB4A; --gold-soft:#3A3020; --good:#4CC38B; --good-soft:#1E3A2D; --bad:#F06A6A; --bad-soft:#402424;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121A17; --surface:#1B2521; --soft:#24302B; --ink:#E6EEEA; --muted:#9BABA4; --line:#2F3C37;
  --accent:#F27394; --accent-soft:#3D2430; --accent-ink:#1A0E12;
  --gold:#F0BB4A; --gold-soft:#3A3020; --good:#4CC38B; --good-soft:#1E3A2D; --bad:#F06A6A; --bad-soft:#402424;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap}
.pill.coin{background:var(--gold-soft);color:var(--ink)}
.pill.lv{background:var(--accent-soft)}
.coin-ic{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#E2A21A 70%);box-shadow:inset 0 0 0 2px #C98A10;flex:none}

main{max-width:620px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.label{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px;font-family:var(--f-display)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;font-family:var(--f-display);font-size:15px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn-ghost{background:var(--soft);color:var(--ink)}
.btn-gold{background:var(--gold);color:#2A1D00;box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

/* home */
.scene{border-radius:20px;overflow:hidden;position:relative;box-shadow:var(--shadow);background:var(--soft)}
.scene svg.dog-svg{display:block;width:100%;height:auto}
.bubble{position:absolute;left:14px;top:14px;max-width:62%;background:#FFFFFF;color:#1E2A26;border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12);font-family:var(--f-display)}
.namebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.namebar input{font-family:var(--f-display);font-weight:800;font-size:20px;border:0;border-bottom:2px dashed var(--line);background:transparent;color:var(--ink);width:9em;max-width:100%;padding:2px 0}
.stage{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.meter{display:grid;grid-template-columns:5.5em 1fr auto;align-items:center;gap:10px;font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s}
.bar.happy>i{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;border:2px solid transparent}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .chip{text-align:center;padding:12px 6px;font-size:15px;font-family:var(--f-display)}
.custom{display:flex;align-items:center;gap:12px;margin-top:10px}
.custom input[type=range]{flex:1;accent-color:var(--accent)}
.custom output{font-family:var(--f-display);font-weight:800;font-size:18px;min-width:3.5em;text-align:right}
.setup-sec{display:flex;flex-direction:column;gap:10px}
.setup-sec + .setup-sec{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.linkish{font-size:12px;color:var(--accent);font-weight:700;padding:2px 4px}

/* overlay (quiz/result/gacha) */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-in{max-width:620px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:10px}
.qhead .x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:18px;flex:none}
.prog{flex:1;height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qcount{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.cat-tag{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.qtext{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.55;margin:0;text-wrap:pretty}
.combo{font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:14px;min-height:1.4em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:13px 14px;font-weight:500;font-size:15px;box-shadow:0 2px 0 var(--line);min-width:0}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff}
.opt.ng{border-color:var(--bad);background:var(--bad-soft)}
.opt.ng .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.feedback{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.feedback.ok{background:var(--good-soft)}
.feedback.ng{background:var(--bad-soft)}
.feedback .mini{width:64px;flex:none}
.feedback h4{margin:0;font-family:var(--f-display);font-size:17px}
.feedback p{margin:4px 0 0;font-size:14px}

.result-score{text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.result-score .big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.result-score .big small{font-size:22px;color:var(--muted)}
.rank{font-family:var(--f-display);font-weight:800;font-size:15px;padding:4px 14px;border-radius:999px;background:var(--accent-soft)}
.earn{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.earn b{font-family:var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.earn .total{border-top:1px dashed var(--line);padding-top:6px;margin-top:4px;font-size:16px}
.food-name{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center}
.wronglist{display:flex;flex-direction:column;gap:8px}
.wq{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
.wq .a{color:var(--good);font-weight:700;margin-top:4px}
.wq .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}

/* weak */
.catbars{display:flex;flex-direction:column;gap:8px}
.catbar{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:10px;align-items:center;font-size:13px}
.catbar .bar>i{background:var(--c)}
.catbar b{font-family:var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:14px}

/* shop */
.slot-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.slot-tabs .chip{white-space:nowrap}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative;border:2px solid transparent}
.item.on{border-color:var(--accent)}
.item .pv{background:var(--soft);aspect-ratio:13/11;max-width:100%}
.item .pv svg{width:100%;height:100%;display:block}
.item .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.item .nm{font-weight:700;font-size:13px;line-height:1.35}
.item .btn{padding:7px 10px;font-size:13px;border-radius:10px;margin-top:auto}
.rar{position:absolute;top:6px;left:6px;font-family:var(--f-display);font-weight:800;font-size:11px;padding:1px 8px;border-radius:6px;color:#fff;letter-spacing:.04em}
.rar.N{background:#7D8A85}.rar.R{background:#3C7FC9}.rar.SR{background:#8B4FC9}.rar.SSR{background:linear-gradient(90deg,#E0A21A,#E2566E,#8B4FC9)}
.lock{font-size:12px;color:var(--muted);text-align:center;margin-top:auto;padding:6px 0}
.preview-wrap{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.preview-wrap .scene{border-radius:16px}
@media (max-width:420px){.preview-wrap{grid-template-columns:120px 1fr}}

/* gacha */
.machine{display:grid;place-items:center;padding:6px 0}
.machine svg{width:min(240px,70%);height:auto}
.machine.shake svg{animation:shake .5s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px}
.rates div{background:var(--soft);border-radius:10px;padding:6px 2px}
.rates b{display:block;font-family:var(--f-display)}
.pulls{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.pull{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:relative;animation:pop .45s backwards}
.pull .pv{aspect-ratio:13/11;background:var(--soft)}
.pull .pv svg{width:100%;height:100%;display:block}
.pull .nm{font-size:12px;font-weight:700;padding:6px 8px 2px}
.pull .st{font-size:11px;padding:0 8px 8px;color:var(--muted)}
.pull.new .st{color:var(--accent);font-weight:700}
.pull.SSR{box-shadow:0 0 0 3px #E0A21A,var(--shadow)}
.pull.SR{box-shadow:0 0 0 3px #8B4FC9,var(--shadow)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}

.xfer{width:100%;font:12px/1.5 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft);color:var(--ink);resize:vertical;word-break:break-all}
.warn{margin:0;background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* dog animation */
.dog-svg .tail{transform-box:fill-box;transform-origin:100% 0%;animation:wag 1.6s ease-in-out infinite}
.dog-svg.happy .tail{animation-duration:.35s}
.dog-svg.happy .dogbody{animation:hop .5s ease-in-out 3}
.dog-svg.sad .headgrp{transform-box:fill-box;transform-origin:10% 95%;transform:rotate(14deg)}
.dog-svg.eating .headgrp{transform-box:fill-box;transform-origin:10% 95%;animation:eat .55s ease-in-out infinite alternate}
.dog-svg .breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3.2s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes eat{from{transform:rotate(30deg)}to{transform:rotate(40deg)}}
@keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
.sparkle{animation:twinkle 1.2s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top"><div class="top-in">

<script>
const CATS = {
  cell:  { name: '細胞・組織',   color: '#8C6BD1' },

// [カテゴリ, 問題, 正解, 誤答1, 誤答2, 誤答3, ポイント]
const QRAW = [
// 細胞・組織
['cell','細胞内でATPを主に産生する細胞小器官は？','ミトコンドリア','リボソーム','ゴルジ装置','リソソーム','好気的呼吸（クエン酸回路・電子伝達系）の場。'],
['cell','タンパク質合成の場となる細胞小器官は？','リボソーム','ミトコンドリア','リソソーム','中心体','mRNAの情報をもとにアミノ酸をつなげる。'],
['cell','加水分解酵素を含み、細胞内の不要物を分解する小器官は？','リソソーム','ゴルジ装置','滑面小胞体','核小体',''],

['cell','ヒトの体細胞の染色体数は？','46本','23本','44本','48本','常染色体44本＋性染色体2本。生殖細胞は23本。'],
['cell','細胞膜の主成分は？','リン脂質','グリコーゲン','核酸','コラーゲン','リン脂質二重層にタンパク質が埋まった構造。'],

['cell','細胞外液に最も多い陽イオンは？','ナトリウムイオン（Na⁺）','カリウムイオン（K⁺）','マグネシウムイオン（Mg²⁺）','水素イオン（H⁺）',''],
['cell','血管の内腔面を覆う上皮（内皮）の種類は？','単層扁平上皮','重層扁平上皮','移行上皮','多列線毛上皮',''],

['cell','DNAの遺伝情報をmRNAに写し取る過程は？','転写','翻訳','複製','スプライシング','mRNAからタンパク質をつくるのが翻訳。'],
['cell','精子や卵子をつくる細胞分裂は？','減数分裂','体細胞分裂','無糸分裂','出芽',''],
['cell','腱や靱帯をつくる主なタンパク質は？','コラーゲン','ケラチン','アクチン','アルブミン',''],

// 骨格系
['bone','成人の骨の数はおよそ？','約206個','約106個','約306個','約156個',''],
['bone','頸椎の数は？','7個','12個','5個','8個','頸椎7・胸椎12・腰椎5・仙骨1・尾骨1。'],

['bone','腰椎の数は？','5個','7個','12個','4個',''],
['bone','第1頸椎の名称は？','環椎','軸椎','隆椎','岬角','椎体がなく輪の形。'],

/* ============ quiz run ============ */
let Q = null;
function startQuiz(list, label){
  if (!list.length) { toast('出題できる問題がありません'); return; }
  Q = { list: list.map(q => ({ ...q, opts: shuffle([q.a, ...q.w]) })), i: 0, correct: 0, combo: 0, maxCombo: 0, coins: 0, comboBonus: 0, wrongs: [], picked: null, label, fed: false, beatenNow: 0 };
  $('#overlay').hidden = false; document.body.style.overflow = 'hidden';
  drawQ();
}
function drawQ(){
  const q = Q.list[Q.i]; const c = CATS[q.cat];
  const done = Q.picked != null;
  const ok = done && Q.picked === q.a;
  $('#ov').innerHTML = `
  <div class="qhead"><button class="x" data-act="quit" aria-label="中断する">✕</button><div class="prog"><i style="width:${(Q.i + (done?1:0)) / Q.list.length * 100}%"></i></div><span class="qcount">${Q.i + 1}/${Q.list.length}</span></div>
  <div class="qcard">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="cat-tag" style="background:${c.color}">${c.name}</span><span class="combo">${Q.combo >= 2 ? Q.combo + ' コンボ！' : ''}</span></div>
    <p class="qtext">${esc(q.q)}</p>
  </div>
  <div class="opts">${q.opts.map((o, i) => {
    let cls = ''; if (done) { if (o === q.a) cls = 'ok'; else if (o === Q.picked) cls = 'ng'; }
    return `<button class="opt ${cls}" data-pick="${i}" ${done?'disabled':''}><span class="k">${'ABCD'[i]}</span><span style="min-width:0">${esc(o)}</span></button>`; }).join('')}</div>
  ${done ? `<div class="feedback ${ok?'ok':'ng'}"><div class="mini">${dogSVG(S.eq, { mood: ok?'happy':'sad', viewBox:'150 30 90 70', bg:false })}</div><div style="min-width:0"><h4>${ok ? (Q.combo>=3?'すごい！ 正解だワン！':'正解だワン！') : 'ざんねん… 苦手コーナーに入れたワン'}</h4><p>正解：<b>${esc(q.a)}</b></p>${q.e?`<p>${esc(q.e)}</p>`:''}</div></div>
  <button class="btn btn-primary btn-wide" data-act="next" id="nextBtn">${Q.i + 1 < Q.list.length ? '次の問題へ' : '結果を見る'}</button>` : ''}`;
  if (done) $('#nextBtn').focus();
}
function pick(i){
  if (!Q || Q.picked != null) return;
  const q = Q.list[Q.i]; const ans = q.opts[i]; Q.picked = ans;
  const ok = ans === q.a;
  S.answered++; const st = S.stats[q.cat] || (S.stats[q.cat] = { c:0, t:0 }); st.t++;
  if (ok) {
    S.correct++; st.c++; Q.correct++; Q.combo++; Q.maxCombo = Math.max(Q.maxCombo, Q.combo);
    Q.coins += 10; if (Q.combo >= 3) Q.comboBonus += 5;
    const w = S.weak[q.id];
    if (w) { w.streak = (w.streak || 0) + 1; if (w.streak >= 2) { delete S.weak[q.id]; S.beaten = (S.beaten || 0) + 1; Q.beatenNow++; } }
  } else {
    Q.combo = 0; Q.wrongs.push(q);
    const w = S.weak[q.id] || (S.weak[q.id] = { miss:0, streak:0 }); w.miss++; w.streak = 0; w.at = Date.now();
  }
  drawQ();
}
function next(){
  if (!Q) return;
  if (Q.i + 1 < Q.list.length) { Q.i++; Q.picked = null; drawQ(); window.scrollTo(0,0); $('#overlay').scrollTop = 0; }
  else finish();
}
function finish(){
  const n = Q.list.length, pct = Math.round(Q.correct / n * 100);
  Q.pct = pct; Q.tier = foodTier(pct);
  Q.perfect = pct === 100 ? n * 5 : 0;
  Q.total = Q.coins + Q.comboBonus + Q.perfect;
  S.coins += Q.total; S.plays++; S.best = Math.max(S.best, pct);
  save(); header();
  drawResult();
}
function rankOf(p){ return p === 100 ? 'パーフェクト！' : p >= 80 ? 'すばらしい！' : p >= 60 ? 'いい調子！' : p >= 40 ? 'もうひといき' : '復習しよう'; }
function drawResult(mood){

  $('#ov').innerHTML = `

  <div class="scene">${dogSVG(S.eq, { scale: stageOf(S.level).s, mood: mood || 'idle', food: Q.tier })}<div class="bubble">${esc(mood==='eating'||mood==='happy' ? f.line : 'ごはんはなにかな…？')}</div></div>

    <span>パーフェクトボーナス</span><b>${Q.perfect}</b>
    <span class="total">合計</span><b class="total" style="color:var(--gold)">+${Q.total}</b></div>
    ${Q.beatenNow ? `<p class="sub" style="margin-top:8px">苦手を ${Q.beatenNow} 問克服しました（2回連続正解で苦手コーナーから卒業）</p>` : ''}
  </section>
  ${Q.wrongs.length ? `<section class="card"><h3>まちがえた問題（${Q.wrongs.length}）</h3><div class="wronglist" style="margin-top:10px">${Q.wrongs.map(wqHTML).join('')}</div></section>` : ''}

    <button class="btn btn-ghost" data-act="close">ホームへ</button>
  </div>`;
}
function wqHTML(q){

function feed(){
  if (!Q || Q.fed) return;

    while (S.exp >= expNeed(S.level)) { S.exp -= expNeed(S.level); S.level++; ups++; }
    if (ups) S.coins += ups * 50;
    save(); header();
    drawResult('happy');
    toast(ups ? `レベルアップ！ Lv.${S.level}（ボーナス +${ups*50}コイン）` : `EXP +${gain}　なかよし度 +${f.happy}`);
  }, 2200);
}
function closeOverlay(){ $('#overlay').hidden = true; document.body.style.overflow = ''; Q = null; render(); }

    <p class="sub">コレクション ${own} / ${total}　・　かぶり返却 N 10 / R 30 / SR 80 / SSR 200</p>
  </section>`;

function rollRarity(minSR){
  if (minSR) return Math.random() < 0.2 ? 'SSR' : 'SR';
  let x = Math.random() * 100;
  for (const [r, p] of Object.entries(RATES)) { if ((x -= p) < 0) return r; }
  return 'N';
}
let gachaBusy = false;
function pull(n){
  const cost = n === 10 ? 900 : 100;
  if (gachaBusy || S.coins < cost) return;
  gachaBusy = true;
  S.coins -= cost;
  const res = [];
  for (let k = 0; k < n; k++) {
    let r = rollRarity(n === 10 && k === n - 1 && !res.some(x => x.it.r === 'SR' || x.it.r === 'SSR'));
    const pool = ITEMS.filter(i => !i.def && i.r === r);
    const it = pool[Math.floor(Math.random() * pool.length)];
    const isNew = !S.owned.includes(it.id);
    if (isNew) S.owned.push(it.id); else S.coins += DUPE[it.r];
    res.push({ it, isNew });
  }
  save(); header();
  const m = $('#machine'); if (m) m.classList.add('shake');
  setTimeout(() => {
    gachaBusy = false;
    const best = res.some(x => x.it.r === 'SSR') ? 'SSR' : res.some(x => x.it.r === 'SR') ? 'SR' : '';
    $('#overlay').hidden = false; document.body.style.overflow = 'hidden';
    $('#ov').innerHTML = `
      <div class="qhead"><button class="x" data-act="closeGacha" aria-label="閉じる">✕</button><h2 style="flex:1">${best === 'SSR' ? 'SSRが出た！' : best === 'SR' ? 'SRゲット！' : 'ガチャ結果'}</h2></div>
      <div class="pulls">${res.map((x, i) => `<div class="pull ${x.it.r} ${x.isNew?'new':''}" style="animation-delay:${i*.08}s"><span class="rar ${x.it.r}">${x.it.r}</span><div class="pv">${itemPreview(x.it)}</div><div class="nm">${esc(x.it.name)}</div><div class="st">${x.isNew ? 'NEW!' : `かぶり +${DUPE[x.it.r]}コイン`}</div>${x.isNew ? `<button class="btn btn-ghost" style="margin:0 8px 8px;padding:6px;font-size:12px;width:calc(100% - 16px)" data-equip="${x.it.id}">着る</button>` : ''}</div>`).join('')}</div>
      <div class="row"><button class="btn btn-gold" data-gacha="${n}" ${S.coins<cost?'disabled':''}>もう一度（${cost}）</button><button class="btn btn-ghost" data-act="closeGacha">とじる</button></div>`;
  }, 900);
}

/* ============ events ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-act="pet"]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.tabGo) return go(d.tabGo);
  if (d.count) { if (d.count === 'custom') setup.mode = 'custom'; else { setup.mode = 'count'; setup.count = +d.count; } saveSetup(); return render(); }
  if (d.cat) { setup.cats = setup.cats.includes(d.cat) ? setup.cats.filter(c => c !== d.cat) : [...setup.cats, d.cat]; saveSetup(); return render(); }
  if (d.cats) { setup.cats = d.cats === 'all' ? Object.keys(CATS) : []; saveSetup(); return render(); }
  if (d.pick != null) return pick(+d.pick);
  if (d.wf) { weakFilter = d.wf; return render(); }
  if (d.slot) { shopSlot = d.slot; return render(); }
  if (d.buy) return buy(d.buy);
  if (d.equip) { const it = IMAP[d.equip]; if (it && S.owned.includes(it.id)) { S.eq[it.slot] = it.id; save(); toast(`${it.name}を着せました`); if ($('#overlay').hidden) render(); else { t.disabled = true; t.textContent = '着せました'; } } return; }
  if (d.unequip) { S.eq[d.unequip] = null; save(); return render(); }
  if (d.gacha) { if (!$('#overlay').hidden) { $('#overlay').hidden = true; document.body.style.overflow=''; } return pull(+d.gacha); }
  switch (d.act) {
    case 'start': return quizFromSetup();
    case 'next': return next();
    case 'quit': if (t.dataset.confirm) { closeOverlay(); } else { t.dataset.confirm = '1'; t.textContent = '終了'; t.style.width = 'auto'; t.style.padding = '0 12px'; t.style.borderRadius = '999px'; t.style.fontSize = '13px'; toast('もう一度押すと中断します（解答済みの記録は残ります）'); } return;
    case 'feed': return feed();
    case 'close': return closeOverlay();
    case 'closeGacha': $('#overlay').hidden = true; document.body.style.overflow = ''; return render();
    case 'again': { closeOverlay(); return quizFromSetup(); }
    case 'retryWrong': { const w = shuffle(Q.wrongs); Q = null; return startQuiz(w, 'まちがい直し'); }
    case 'weakQuiz': { const ids = Object.keys(S.weak).filter(k => QMAP[k] && (weakFilter === 'all' || QMAP[k].cat === weakFilter)); return startQuiz(shuffle(ids.map(k => QMAP[k])).slice(0, 20), '苦手復習'); }
    case 'xferOut': xfer = xfer === 'out' ? null : 'out'; render(); { const a = $('#xferCard'); if (a) a.scrollIntoView({ block:'nearest' }); } return;
    case 'xferIn': xfer = xfer === 'in' ? null : 'in'; render(); { const a = $('#xferInput'); if (a) a.focus(); } return;
    case 'xferCopy': { const ta = $('#xferText'); const done = () => toast('コピーしました。メモ帳などに保存してください'); const fallback = () => { ta.focus(); ta.select(); toast('選択しました。長押しでコピーしてください'); }; try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (e2) { fallback(); } return; }
    case 'xferLoad': { const v = ($('#xferInput') || {}).value || ''; try { const o = decodeSave(v); S = Object.assign(defaultState(), o); S.lastDecay = Date.now(); save(); xfer = null; render(); toast(`${S.name}（Lv.${S.level}）の記録を復元しました`); } catch (e2) { toast('コードが読み取れません。IGGY1: から最後まで全部貼り付けてください'); } return; }
    case 'pet': { const sc = $('.scene .dog-svg'); if (!sc) return; sc.classList.remove('happy'); void sc.getBoundingClientRect(); sc.classList.add('happy'); const lines = ['なでなで、うれしいワン', '次は満点めざすワン！', '心臓の弁は4つあるワン', '赤血球の寿命は120日だワン', 'ガチャ、引いてみたいワン']; $('#bubble').textContent = lines[Math.floor(Math.random()*lines.length)]; setTimeout(() => sc.classList.remove('happy'), 1600); return; }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'dogName') { S.name = e.target.value.trim() || 'こむぎ'; save(); }
});
document.addEventListener('keydown', e => {
  if ($('#overlay').hidden || !Q || e.target.tagName === 'INPUT') return;
  if (Q.picked == null && ['1','2','3','4','a','b','c','d'].includes(e.key.toLowerCase())) { const k = e.key.toLowerCase(); pick('1234'.includes(k) ? +k - 1 : 'abcd'.indexOf(k)); }
});

tab = valid.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
render();
</script>
